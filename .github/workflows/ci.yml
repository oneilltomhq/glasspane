name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # libxkbcommon for smithay's keymaps; libgbm for the test fixture's
      # dma-buf allocator, a dev-dependency. libwayland-client is loaded at
      # run time, not linked.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      # The runner has no /dev/dri, so every test that needs a GPU skips
      # (and says so); the rest run.
      - run: cargo test
