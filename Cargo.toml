[package]
name = "glasspane"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
authors = ["Tom O'Neill"]
license = "MIT"
repository = "https://github.com/oneilltomhq/glasspane"
description = "A tenant Wayland compositor as a library: hosts Wayland clients and hands you one wgpu::Texture per client, plus an input-injection API. No placement policy, no scene, no scanout."
keywords = ["wayland", "compositor", "wgpu", "dmabuf", "smithay"]
categories = ["graphics", "gui", "os::linux-apis"]
readme = "README.md"
exclude = ["/.github", "/target"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "vulkan",
    "wgsl",
] }
wgpu-dmabuf = "0.1"
drm-fourcc = "2"
libc = "0.2"
tracing = "0.1"
# The desktop's clipboard (`clipboard.rs`), spoken on the shell window's own
# Wayland connection. The system backend is what can share a `wl_display`
# another library opened; loaded at run time, as winit loads it, so a
# headless caller needs no libwayland-client to build or to run.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
# How the shell hands over that connection: its window's display handle. The
# version wgpu (and winit) already hold.
raw-window-handle = "0.6"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "wayland_frontend",
    "desktop",
]

[dev-dependencies]
pollster = "0.4"
libc = "0.2"
png = "0.17"
# The test fixture is a *real* Wayland client on a real socket — glasspane is
# the server, so the suite needs no Wayland session of its own — and it paints
# through both transports, so it needs the client libraries and a GBM
# allocator to mint a dma-buf with.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wgpu-dmabuf = { version = "0.1", features = ["gbm"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
